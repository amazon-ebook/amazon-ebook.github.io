<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="6kDHJjYqrD2b3iTNv1S265vGS-TXNFetJfSg55x8qe8" />
    <title>{{ .Site.Title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Hero Section -->
    <section class="bg-blue-600 text-white py-20">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl font-bold mb-4">Transform Your Life Today</h1>
            <p class="text-xl">Unlock the secrets of health, wealth, and mindset with our hand-picked Amazon bestsellers.</p>
        </div>
    </section>

    <!-- Bestsellers Grid -->
    <section class="container mx-auto py-10 px-4">
        <h2 class="text-3xl font-bold mb-8 text-center">Top Bestsellers</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6">
            {{ range .Site.Data.bestsellers }}
            <div class="bg-white rounded-lg shadow-md p-4">
                <img src="{{ .Image_URL }}" alt="{{ .Title }}" class="w-full h-48 object-cover mb-4">
                <h3 class="text-lg font-semibold mb-2">{{ .Title }}</h3>
                <a href="/books/{{ .Book_ID }}/" class="bg-orange-500 hover:bg-orange-600 text-white py-2 px-4 rounded block text-center">View Book</a>
            </div>
            {{ end }}
        </div>
    </section>
</body>
</html>
